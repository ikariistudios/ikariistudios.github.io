    --bg: #0E0B24; --bg-2: #15112F; --card: #1B163B; --line: #2C2558;
    --ink: #F2EFFF; --ink-2: #A9A2D6; --star: #FFE7A3; --primary: #B7A6EE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 70% -10%, #2A1F63 0%, transparent 60%), var(--bg);
    color: var(--ink); line-height: 1.6; min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { width: min(1080px, 100% - 40px); margin-inline: auto; position: relative; z-index: 1; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .nebula { position: fixed; inset: -20%; z-index: 0; pointer-events: none; overflow: hidden; }
  .nebula span { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .45; will-change: transform; }
  .nebula .n1 { width: 55vmax; height: 55vmax; left: 10%; top: 0%; background: radial-gradient(circle, #5B3FC4 0%, transparent 65%); animation: drift1 28s ease-in-out infinite alternate; }
  .nebula .n2 { width: 45vmax; height: 45vmax; right: 5%; top: 25%; background: radial-gradient(circle, #B4438A 0%, transparent 65%); opacity: .28; animation: drift2 34s ease-in-out infinite alternate; }
  .nebula .n3 { width: 50vmax; height: 50vmax; left: 30%; bottom: -10%; background: radial-gradient(circle, #2E4BB8 0%, transparent 65%); opacity: .3; animation: drift3 40s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(18vw, 12vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-20vw, 14vh) scale(.9); } }
  @keyframes drift3 { to { transform: translate(-12vw, -16vh) scale(1.2); } }

  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 76px; }
  nav img { height: 34px; }
  nav .links { display: flex; gap: 22px; color: var(--ink-2); font-weight: 500; font-size: 15px; }
  nav .links a:hover { color: var(--ink); }

  .hero { padding: 72px 0 56px; text-align: center; }
  .mark-wrap { position: relative; width: 170px; height: 170px; margin: 0 auto 30px; }
  .mark-wrap img { width: 100%; height: 100%; animation: rise 1s ease-out both; }
  .twinkle { position: absolute; width: 26px; height: 26px; right: 6px; top: 0; color: var(--star); filter: drop-shadow(0 0 10px var(--star)); animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { transform: scale(.75) rotate(0); opacity: .7; } 50% { transform: scale(1.15) rotate(20deg); opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  h1 { font-size: clamp(40px, 7vw, 72px); line-height: 1.05; letter-spacing: .08em; font-weight: 800; }
  h1 span { background: linear-gradient(90deg, #C9B8FF, #FFC6DA); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { font-size: 19px; color: var(--ink-2); max-width: 560px; margin: 14px auto 0; letter-spacing: .02em; }

  section { padding: 40px 0 72px; }
  .head { display: flex; align-items: end; justify-content: space-between; margin-bottom: 22px; gap: 16px; }
  h2 { font-size: 28px; font-weight: 800; }
  .count { color: var(--ink-2); font-size: 15px; }

  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .app {
    position: relative; display: flex; flex-direction: column; gap: 14px; padding: 26px;
    border-radius: 26px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 16%, var(--card)), var(--card) 55%);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line));
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
  }
  a.app:hover { transform: translateY(-4px); box-shadow: 0 24px 60px -28px var(--accent); border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .app-top { display: flex; align-items: center; gap: 16px; }
  .icon { width: 64px; height: 64px; border-radius: 18px; flex: none; object-fit: cover; }
  .icon-fallback { display: grid; place-items: center; font-weight: 800; font-size: 28px; background: var(--accent); color: #0E0B24; }
  .app h3 { font-size: 21px; font-weight: 800; letter-spacing: .02em; }
  .tagline { color: var(--accent); font-weight: 600; font-size: 14.5px; }
  .desc { color: var(--ink-2); font-size: 15.5px; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { padding: 5px 11px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .go { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); margin-top: 4px; }
  .go::after { content: "→"; transition: transform .2s; }
  a.app:hover .go::after { transform: translateX(4px); }
  .soon { color: var(--ink-2); font-weight: 600; font-size: 14px; margin-top: 4px; }

  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 760px) { .about { grid-template-columns: 1fr; } nav .links { display: none; } }
  .about div { padding: 26px; border-radius: 24px; background: var(--card); border: 1px solid var(--line); }
  .about h3 { font-size: 18px; margin-bottom: 6px; }
  .about p { color: var(--ink-2); font-size: 15.5px; }

  footer { padding: 40px 0 56px; text-align: center; color: var(--ink-2); font-size: 14px; }
  footer img { height: 38px; margin: 0 auto 14px; opacity: .85; display: block; }
  @media (prefers-reduced-motion: reduce) { .twinkle, .mark-wrap img, .nebula span { animation: none; } }
</style>
</head>

    function frame(t) {
      const dt = Math.min((t - last) / 1000 || 0, .05); last = t;
      mouse.x += (mouse.tx - mouse.x) * .05; mouse.y += (mouse.ty - mouse.y) * .05;
      ctx.clearRect(0, 0, W, H);

      for (const st of stars) {
        const L = LAYERS[st.L];
        if (!still) {
          st.x -= L.speed * dt;          // slow drift to the left
          st.y += L.speed * .25 * dt;    // and slightly down
          if (st.x < -4) st.x += W + 8;
          if (st.y > H + 4) st.y -= H + 8;
        }
        const px = st.x + mouse.x * L.parallax, py = st.y + mouse.y * L.parallax - scrollY * .04 * (st.L + 1);
        const y = ((py % H) + H) % H, x = ((px % W) + W) % W;
        const tw = still ? .8 : .45 + .55 * Math.sin(t / 1000 * st.s + st.p) ** 2;
        ctx.globalAlpha = L.alpha * tw; ctx.fillStyle = st.L === 2 ? "#FFF1CF" : "#E9E4FF";
        ctx.beginPath(); ctx.arc(x, y, st.r, 0, 6.283); ctx.fill();
      }

      if (!still) {
        nextShot -= dt * 1000;
        if (nextShot <= 0) { shoot(); nextShot = rand(2800, 6500); }
        shooters = shooters.filter(sh => (sh.life += dt) < sh.max);
        for (const sh of shooters) {
          sh.x += sh.vx * dt; sh.y += sh.vy * dt;
          const fade = Math.sin(Math.PI * sh.life / sh.max);
          const tx = sh.x - sh.vx * .14, ty = sh.y - sh.vy * .14;
          const g = ctx.createLinearGradient(sh.x, sh.y, tx, ty);
          g.addColorStop(0, `rgba(255,240,210,${.95 * fade})`); g.addColorStop(1, "rgba(255,240,210,0)");
          ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = "round";
          ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(tx, ty); ctx.stroke();
          ctx.fillStyle = `rgba(255,250,235,${fade})`; ctx.beginPath(); ctx.arc(sh.x, sh.y, 1.8, 0, 6.283); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      if (!still) requestAnimationFrame(frame);
    }

    addEventListener("resize", resize);
    addEventListener("pointermove", e => { mouse.tx = e.clientX / W - .5; mouse.ty = e.clientY / H - .5; });
    addEventListener("scroll", () => { if (still) requestAnimationFrame(frame); }, { passive: true });
    resize(); requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
